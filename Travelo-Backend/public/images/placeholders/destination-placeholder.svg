<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Mountain silhouette -->
  <path d="M0 200 L80 120 L140 180 L200 100 L280 190 L340 140 L400 220 L400 300 L0 300 Z" fill="#cbd5e1" opacity="0.6"/>
  <path d="M0 220 L60 160 L130 210 L190 150 L260 220 L320 180 L400 240 L400 300 L0 300 Z" fill="#94a3b8" opacity="0.4"/>
  
  <!-- Sun/Moon -->
  <circle cx="320" cy="60" r="25" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Center icon -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="50" fill="url(#iconGrad)" opacity="0.3"/>
    <path d="M-20 -10 L0 -30 L20 -10 L20 20 L-20 20 Z" fill="#64748b" opacity="0.5"/>
    <rect x="-25" y="20" width="50" height="15" fill="#64748b" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">Destination</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Image Placeholder</text>
</svg>
