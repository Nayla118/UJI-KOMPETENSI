<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Decorative pattern -->
  <circle cx="50" cy="50" r="30" fill="#fbbf24" opacity="0.3"/>
  <circle cx="350" cy="250" r="40" fill="#f59e0b" opacity="0.3"/>
  <circle cx="300" cy="50" r="25" fill="#fbbf24" opacity="0.3"/>
  
  <!-- Center suitcase icon -->
  <g transform="translate(200, 130)">
    <!-- Suitcase body -->
    <rect x="-40" y="-20" width="80" height="60" rx="8" fill="url(#iconGrad)" opacity="0.8"/>
    <!-- Suitcase handle -->
    <path d="M-15 -20 L-15 -35 A15 15 0 0 1 15 -35 L15 -20" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <!-- Suitcase details -->
    <rect x="-30" y="5" width="60" height="25" rx="4" fill="#fef3c7" opacity="0.5"/>
    <circle cx="-15" cy="17" r="3" fill="#b45309"/>
    <circle cx="15" cy="17" r="3" fill="#b45309"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">Tour Package</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">Image Placeholder</text>
  
  <!-- Decorative travel elements -->
  <path d="M50 250 Q70 240 90 250 T130 250" fill="none" stroke="#d97706" stroke-width="2" opacity="0.5"/>
  <path d="M270 50 Q290 40 310 50" fill="none" stroke="#d97706" stroke-width="2" opacity="0.5"/>
</svg>
