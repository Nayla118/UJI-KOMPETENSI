<!-- 
  TRAVELO FAVICON
  32x32 Icon for browser tabs and bookmarks
  Based on Concept 1: Navigator
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="15" fill="url(#favGrad)"/>
  
  <!-- Compass -->
  <g transform="translate(16, 16)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <path d="M0 -7 L2 -2 L0 0 L-2 -2 Z" fill="white"/>
    <path d="M0 7 L2 2 L0 0 L-2 2 Z" fill="white" opacity="0.6"/>
    <path d="M7 0 L2 2 L0 0 L2 -2 Z" fill="white" opacity="0.6"/>
    <path d="M-7 0 L-2 2 L0 0 L-2 -2 Z" fill="white" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.5" fill="white"/>
  </g>
</svg>
