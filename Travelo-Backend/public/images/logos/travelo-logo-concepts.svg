<!-- 
  TRAVELO LOGO CONCEPTS
  Professional Travel Website Branding
  Created for: Travelo Admin Panel
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    
    <linearGradient id="sunsetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="24" font-weight="600" fill="#1e293b">TRAVELO - Logo Concepts</text>
  <text x="600" y="80" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#64748b">Professional Travel Website Branding</text>

  <!-- CONCEPT 1: Compass & Wordmark -->
  <g id="concept1" transform="translate(100, 150)">
    <!-- Background Card -->
    <rect x="0" y="0" width="300" height="280" rx="16" fill="white" filter="url(#softShadow)"/>
    
    <!-- Label -->
    <text x="150" y="30" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b">CONCEPT 1: NAVIGATOR</text>
    
    <!-- Compass Icon -->
    <g transform="translate(150, 100)">
      <!-- Outer Circle -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="url(#primaryGradient)" stroke-width="3"/>
      <!-- Inner Circle -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <!-- North Pointer -->
      <path d="M0 -35 L8 -8 L0 0 L-8 -8 Z" fill="url(#primaryGradient)"/>
      <!-- South Pointer -->
      <path d="M0 35 L8 8 L0 0 L-8 8 Z" fill="#94a3b8"/>
      <!-- East Pointer -->
      <path d="M35 0 L8 8 L0 0 L8 -8 Z" fill="#94a3b8"/>
      <!-- West Pointer -->
      <path d="M-35 0 L-8 8 L0 0 L-8 -8 Z" fill="#94a3b8"/>
      <!-- Center Dot -->
      <circle cx="0" cy="0" r="4" fill="url(#primaryGradient)"/>
      <!-- Direction Marks -->
      <text x="0" y="-52" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="700">N</text>
      <text x="0" y="62" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="700">S</text>
      <text x="48" y="4" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="700">E</text>
      <text x="-48" y="4" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="700">W</text>
    </g>
    
    <!-- Wordmark -->
    <text x="150" y="190" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="32" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="150" y="210" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="4">EXPLORE MORE</text>
    
    <!-- Color Palette -->
    <g transform="translate(75, 240)">
      <circle cx="0" cy="0" r="10" fill="#2563eb"/>
      <circle cx="25" cy="0" r="10" fill="#1d4ed8"/>
      <circle cx="50" cy="0" r="10" fill="#1e293b"/>
      <circle cx="75" cy="0" r="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    </g>
  </g>

  <!-- CONCEPT 2: Airplane & Path -->
  <g id="concept2" transform="translate(450, 150)">
    <!-- Background Card -->
    <rect x="0" y="0" width="300" height="280" rx="16" fill="white" filter="url(#softShadow)"/>
    
    <!-- Label -->
    <text x="150" y="30" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b">CONCEPT 2: JOURNEY</text>
    
    <!-- Airplane Icon with Path -->
    <g transform="translate(150, 100)">
      <!-- Flight Path -->
      <path d="M-60 20 Q-30 -10 0 0 Q30 10 60 -20" fill="none" stroke="url(#oceanGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,4"/>
      <!-- Airplane -->
      <g transform="translate(0, 0) rotate(-15)">
        <!-- Body -->
        <ellipse cx="0" cy="0" rx="25" ry="6" fill="url(#primaryGradient)"/>
        <!-- Wings -->
        <path d="M-5 -3 L-15 -18 L-5 -15 L5 -15 L15 -18 L5 -3 Z" fill="url(#primaryGradient)"/>
        <!-- Tail -->
        <path d="M-20 0 L-28 -12 L-20 -8 Z" fill="url(#primaryGradient)"/>
        <!-- Window -->
        <circle cx="10" cy="-2" r="2" fill="white" opacity="0.6"/>
      </g>
      <!-- Start Point -->
      <circle cx="-60" cy="20" r="5" fill="url(#sunsetGradient)"/>
      <!-- End Point -->
      <circle cx="60" cy="-20" r="5" fill="url(#primaryGradient)"/>
    </g>
    
    <!-- Wordmark -->
    <text x="150" y="190" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="32" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="150" y="210" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="3">YOUR JOURNEY STARTS</text>
    
    <!-- Color Palette -->
    <g transform="translate(75, 240)">
      <circle cx="0" cy="0" r="10" fill="#2563eb"/>
      <circle cx="25" cy="0" r="10" fill="#06b6d4"/>
      <circle cx="50" cy="0" r="10" fill="#f59e0b"/>
      <circle cx="75" cy="0" r="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    </g>
  </g>

  <!-- CONCEPT 3: Globe & Location -->
  <g id="concept3" transform="translate(800, 150)">
    <!-- Background Card -->
    <rect x="0" y="0" width="300" height="280" rx="16" fill="white" filter="url(#softShadow)"/>
    
    <!-- Label -->
    <text x="150" y="30" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b">CONCEPT 3: DISCOVER</text>
    
    <!-- Globe Icon -->
    <g transform="translate(150, 100)">
      <!-- Globe Circle -->
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#primaryGradient)" stroke-width="3"/>
      <!-- Latitude Lines -->
      <ellipse cx="0" cy="0" rx="45" ry="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Longitude Lines -->
      <ellipse cx="0" cy="0" rx="15" ry="45" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="10" ry="38" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Location Pin -->
      <g transform="translate(0, -10)">
        <path d="M0 -25 C-8 -25 -14 -18 -14 -10 C-14 5 0 18 0 18 C0 18 14 5 14 -10 C14 -18 8 -25 0 -25 Z" fill="url(#sunsetGradient)"/>
        <circle cx="0" cy="-10" r="5" fill="white"/>
      </g>
      <!-- Continent Shapes (Abstract) -->
      <path d="M-25 -15 Q-20 -20 -15 -15 Q-10 -10 -15 -5 Q-20 -5 -25 -15" fill="#dbeafe" opacity="0.5"/>
      <path d="M20 -10 Q25 -15 30 -10 Q30 -5 25 -5 Q20 -5 20 -10" fill="#dbeafe" opacity="0.5"/>
    </g>
    
    <!-- Wordmark -->
    <text x="150" y="190" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="32" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="150" y="210" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="10" fill="#64748b" letter-spacing="3">DISCOVER THE WORLD</text>
    
    <!-- Color Palette -->
    <g transform="translate(75, 240)">
      <circle cx="0" cy="0" r="10" fill="#2563eb"/>
      <circle cx="25" cy="0" r="10" fill="#f59e0b"/>
      <circle cx="50" cy="0" r="10" fill="#ef4444"/>
      <circle cx="75" cy="0" r="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    </g>
  </g>

  <!-- MONOCHROME VERSIONS -->
  <text x="600" y="470" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Monochrome Versions (For Versatility)</text>
  
  <!-- Mono Concept 1 -->
  <g transform="translate(150, 510)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(100, 55)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M0 -25 L6 -6 L0 0 L-6 -6 Z" fill="#1e293b"/>
      <path d="M0 25 L6 6 L0 0 L-6 6 Z" fill="#64748b"/>
      <path d="M25 0 L6 6 L0 0 L6 -6 Z" fill="#64748b"/>
      <path d="M-25 0 L-6 6 L0 0 L-6 -6 Z" fill="#64748b"/>
      <circle cx="0" cy="0" r="3" fill="#1e293b"/>
    </g>
    <text x="100" y="105" text-anchor="middle" font-size="22" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="100" y="125" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="2">MONOCHROME</text>
  </g>

  <!-- Mono Concept 2 -->
  <g transform="translate(400, 510)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(100, 55)">
      <path d="M-45 15 Q-22 -8 0 0 Q22 8 45 -15" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,3"/>
      <g transform="translate(0, 0) rotate(-15)">
        <ellipse cx="0" cy="0" rx="18" ry="4.5" fill="#1e293b"/>
        <path d="M-4 -2 L-11 -13 L-4 -11 L4 -11 L11 -13 L4 -2 Z" fill="#1e293b"/>
        <path d="M-14 0 L-20 -9 L-14 -6 Z" fill="#1e293b"/>
      </g>
      <circle cx="-45" cy="15" r="4" fill="#1e293b"/>
      <circle cx="45" cy="-15" r="4" fill="#64748b"/>
    </g>
    <text x="100" y="105" text-anchor="middle" font-size="22" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="100" y="125" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="2">MONOCHROME</text>
  </g>

  <!-- Mono Concept 3 -->
  <g transform="translate(650, 510)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(100, 55)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="32" ry="11" fill="none" stroke="#cbd5e1" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="11" ry="32" fill="none" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M0 -18 C-6 -18 -10 -13 -10 -7 C-10 4 0 13 0 13 C0 13 10 4 10 -7 C10 -13 6 -18 0 -18 Z" fill="#1e293b"/>
      <circle cx="0" cy="-7" r="3.5" fill="white"/>
    </g>
    <text x="100" y="105" text-anchor="middle" font-size="22" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="100" y="125" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="2">MONOCHROME</text>
  </g>

  <!-- USAGE EXAMPLES -->
  <text x="600" y="690" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Logo Usage Examples</text>
  
  <!-- Light Background -->
  <g transform="translate(150, 720)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(20, 30)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="url(#primaryGradient)" stroke-width="2"/>
      <path d="M0 -8 L3 -3 L0 0 L-3 -3 Z" fill="url(#primaryGradient)"/>
      <path d="M0 8 L3 3 L0 0 L-3 3 Z" fill="#94a3b8"/>
      <path d="M8 0 L3 3 L0 0 L3 -3 Z" fill="#94a3b8"/>
      <path d="M-8 0 L-3 3 L0 0 L-3 -3 Z" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="1.5" fill="url(#primaryGradient)"/>
    </g>
    <text x="55" y="35" font-size="18" font-weight="800" fill="#1e293b">Travelo</text>
    <text x="260" y="35" text-anchor="end" font-size="10" fill="#64748b">Light Background</text>
  </g>

  <!-- Dark Background -->
  <g transform="translate(470, 720)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="#1e293b"/>
    <g transform="translate(20, 30)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2"/>
      <path d="M0 -8 L3 -3 L0 0 L-3 -3 Z" fill="white"/>
      <path d="M0 8 L3 3 L0 0 L-3 3 Z" fill="#94a3b8"/>
      <path d="M8 0 L3 3 L0 0 L3 -3 Z" fill="#94a3b8"/>
      <path d="M-8 0 L-3 3 L0 0 L-3 -3 Z" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="1.5" fill="white"/>
    </g>
    <text x="55" y="35" font-size="18" font-weight="800" fill="white">Travelo</text>
    <text x="260" y="35" text-anchor="end" font-size="10" fill="#94a3b8">Dark Background</text>
  </g>

  <!-- Icon Only -->
  <g transform="translate(790, 720)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(30, 30)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#primaryGradient)" stroke-width="2"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M0 -10 L2.5 -2.5 L0 0 L-2.5 -2.5 Z" fill="url(#primaryGradient)"/>
      <path d="M0 10 L2.5 2.5 L0 0 L-2.5 2.5 Z" fill="#94a3b8"/>
      <path d="M10 0 L2.5 2.5 L0 0 L2.5 -2.5 Z" fill="#94a3b8"/>
      <path d="M-10 0 L-2.5 2.5 L0 0 L-2.5 -2.5 Z" fill="#94a3b8"/>
      <circle cx="0" cy="0" r="2" fill="url(#primaryGradient)"/>
    </g>
    <text x="30" y="75" text-anchor="middle" font-size="10" fill="#64748b">Favicon (32x32)</text>
  </g>
</svg>
